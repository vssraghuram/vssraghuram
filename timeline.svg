<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0D0705"/>
    <stop offset="55%" stop-color="#170A08"/>
    <stop offset="100%" stop-color="#0A0503"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFE9A8"/>
    <stop offset="50%" stop-color="#F2B94D"/>
    <stop offset="100%" stop-color="#B4791C"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <pattern id="hex" width="42" height="24.25" patternUnits="userSpaceOnUse">
    <path d="M10.5,0 L31.5,0 L42,12.1 L31.5,24.25 L10.5,24.25 L0,12.1 Z" fill="none" stroke="#C9A227" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
</defs>

<rect x="0" y="0" width="900" height="320" rx="14" fill="url(#bg)"/>
<rect x="0" y="0" width="900" height="320" rx="14" fill="url(#hex)"/>
<rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.55"/>
<circle cx="450" cy="0" r="220" fill="url(#glow)" filter="url(#blur)"/>

<text x="30" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#F2B94D" opacity="0.85">FLIGHT.RECORDER // TIMELINE</text>
<line x1="30" y1="44" x2="870" y2="44" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1"/>

<!-- Horizontal spine -->
<line x1="60" y1="120" x2="840" y2="120" stroke="url(#gold)" stroke-width="2" opacity="0.55"/>

<!-- Node 1: High School -->
<g transform="translate(90,120)">
  <circle r="7" fill="#0B0F14" stroke="url(#gold)" stroke-width="2"/>
  <line x1="0" y1="-7" x2="0" y2="-38" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>
  <text x="0" y="-48" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FF8A80">2019–21</text>
  <text x="0" y="-64" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8E2D6">High School</text>
  <text x="0" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Little Buds School</text>
</g>

<!-- Node 2: Intermediate -->
<g transform="translate(260,120)">
  <circle r="7" fill="#0B0F14" stroke="url(#gold)" stroke-width="2"/>
  <line x1="0" y1="-7" x2="0" y2="-38" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>
  <text x="0" y="-48" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FF8A80">2021–23</text>
  <text x="0" y="-64" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8E2D6">Intermediate (MPC)</text>
  <text x="0" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Sri Chaitanya Jr College</text>
</g>

<!-- Node 3: B.Tech start -->
<g transform="translate(430,120)">
  <circle r="9" fill="url(#gold)" stroke="#FFE9A8" stroke-width="1.5"/>
  <line x1="0" y1="-9" x2="0" y2="-38" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>
  <text x="0" y="-48" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FF8A80">2023–2027</text>
  <text x="0" y="-64" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#F2B94D">B.Tech CSE</text>
  <text x="0" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Aditya University</text>
  <text x="0" y="42" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Surampalem, AP</text>
</g>

<!-- Node 4: SkillDzire internship -->
<g transform="translate(610,120)">
  <circle r="9" fill="#0B0F14" stroke="#FF3B30" stroke-width="2"/>
  <circle r="9" fill="#FF3B30" opacity="0.15"/>
  <line x1="0" y1="-9" x2="0" y2="-38" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>
  <text x="0" y="-48" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FF8A80">May–Jun 2025</text>
  <text x="0" y="-64" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#F2B94D">SkillDzire Internship</text>
  <text x="0" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Full-Stack Web Developer</text>
  <text x="0" y="42" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Hyderabad, India</text>
</g>

<!-- Node 5: iOS + Flutter builds -->
<g transform="translate(780,120)">
  <circle r="7" fill="#0B0F14" stroke="url(#gold)" stroke-width="2"/>
  <line x1="0" y1="-7" x2="0" y2="-38" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>
  <text x="0" y="-48" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#FF8A80">2025–Present</text>
  <text x="0" y="-64" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#E8E2D6">iOS + Flutter Builds</text>
  <text x="0" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9AA0A6">Swift · SwiftUI · Flutter</text>
</g>

<!-- Certification strip -->
<line x1="30" y1="220" x2="870" y2="220" stroke="url(#gold)" stroke-opacity="0.25" stroke-width="1"/>
<text x="30" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#F2B94D" opacity="0.85">CERTIFIED SYSTEMS</text>

<g font-family="ui-sans-serif,system-ui,Helvetica,Arial,sans-serif" font-size="11" fill="#C9C2B4">
  <g transform="translate(30,254)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">JS Algorithms &amp; DS — freeCodeCamp</text></g>
  <g transform="translate(30,278)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">React: The Complete Guide — Udemy</text></g>
  <g transform="translate(30,302)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">Firebase &amp; GCloud Fundamentals — Google</text></g>

  <g transform="translate(320,254)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">Razorpay Gateway Integration — Razorpay</text></g>
  <g transform="translate(320,278)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">C Language — IIET</text></g>
  <g transform="translate(320,302)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">Industry 4.0 &amp; IIoT — NPTEL</text></g>

  <g transform="translate(600,254)"><circle r="3" cy="-4" fill="#FF8A80"/><text x="10" fill="#FF8A80">🏆 SIH 2023 Finalist (200+ teams)</text></g>
  <g transform="translate(600,278)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">3 merged PRs — OSS React library</text></g>
  <g transform="translate(600,302)"><circle r="3" cy="-4" fill="#F2B94D"/><text x="10">Intro to Claude Cowork — Anthropic</text></g>
</g>

</svg>
