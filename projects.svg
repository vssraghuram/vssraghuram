<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0D0705"/>
    <stop offset="55%" stop-color="#170A08"/>
    <stop offset="100%" stop-color="#0A0503"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFE9A8"/>
    <stop offset="50%" stop-color="#F2B94D"/>
    <stop offset="100%" stop-color="#B4791C"/>
  </linearGradient>
  <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#1FA9C9" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#1FA9C9" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <pattern id="hex" width="42" height="24.25" patternUnits="userSpaceOnUse">
    <path d="M10.5,0 L31.5,0 L42,12.1 L31.5,24.25 L10.5,24.25 L0,12.1 Z" fill="none" stroke="#C9A227" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
</defs>

<rect x="0" y="0" width="900" height="480" rx="14" fill="url(#bg)"/>
<rect x="0" y="0" width="900" height="480" rx="14" fill="url(#hex)"/>
<rect x="1" y="1" width="898" height="478" rx="13" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.55"/>
<circle cx="850" cy="20" r="180" fill="url(#glowR)" filter="url(#blur)"/>
<circle cx="40" cy="460" r="180" fill="url(#glowC)" filter="url(#blur)"/>

<text x="30" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#F2B94D" opacity="0.85">MARK.ARCHIVE // BUILD LOG</text>
<line x1="30" y1="44" x2="870" y2="44" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1"/>

